name: Build Android
run-name: "Build Android"

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: apps/mobile_app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Exact on purpose. A floating 3.x cannot be governed: there is
          # no commit to build, so the SDK changes underneath the repository
          # with no pull request and no gate. Flutter 3.47.2 shipped a new
          # analyzer diagnostic as a patch release and turned CI red here on
          # 2026-09-03, a week after 3.47.1 was green. dependency-triage.yml
          # reports a newer stable; the pin is raised in its own reviewable
          # pull request (ADR-0018).
          flutter-version: 3.47.1
          # Note the input names differ from the previous action:
          # here `cache` is the SDK and `pub-cache` the dependencies.
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      # Native folders are not committed in the template (they carry
      # per-app ids). Bootstrap generates android/ from project.env.
      - name: Bootstrap Android platform if missing
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            bash ../../scripts/bootstrap_android.sh
          fi

      - name: Build app bundle
        run: flutter build appbundle --release --dart-define=APP_FLAVOR=prod

      - name: Build APK
        run: flutter build apk --release --dart-define=APP_FLAVOR=prod

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-artifacts
          path: |
            apps/mobile_app/build/app/outputs/**/*.aab
            apps/mobile_app/build/app/outputs/**/*.apk
