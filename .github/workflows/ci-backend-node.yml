name: Backend CI (Node)
run-name: "Backend CI (Node)"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend-node.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-quality:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No lockfile is committed in the template; switch to `npm ci`
      # once your app commits backend/package-lock.json.
      - name: Install dependencies
        run: npm install --no-fund

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Audit (non-blocking)
        run: npm audit --audit-level=high || true
