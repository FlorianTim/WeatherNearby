name: Generate Glossary
run-name: "Generate Glossary"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docs/architecture/glossary.csv"
      - "scripts/automation/docs/generate_glossary.sh"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate glossary
        run: |
          chmod +x scripts/automation/docs/generate_glossary.sh
          bash scripts/automation/docs/generate_glossary.sh

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet docs/architecture/arc42/12-glossary.md || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated glossary
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/arc42/12-glossary.md
          git commit -m "docs: regenerate glossary from CSV"
          git pull --rebase
          git push
