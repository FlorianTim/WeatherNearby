name: Copilot Setup Steps
run-name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Exact on purpose. A floating 3.x cannot be governed: there is
          # no commit to build, so the SDK changes underneath the repository
          # with no pull request and no gate. Flutter 3.47.2 shipped a new
          # analyzer diagnostic as a patch release and turned CI red here on
          # 2026-09-03, a week after 3.47.1 was green. Renovate raises this
          # pin as a normal, reviewable pull request.
          flutter-version: 3.47.1
          # Note the input names differ from the previous action:
          # here `cache` is the SDK and `pub-cache` the dependencies.
          cache: true
          pub-cache: true

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Bootstrap all packages
        run: melos bs
