name: Mobile CI
run-name: "Mobile CI"

# Actions minutes: pull_request workflows run only on ready pull requests
# into main (drafts are skipped, "Ready for review" starts them), cancel
# superseded runs, and no longer re-run on push to main after the merge.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/mobile_app/**"
      - "packages/**"
      - ".github/**"
      - "scripts/**"
      - "pubspec.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate itself lives in lumbrecode-engineering, so a fix to the Flutter
  # setup reaches every derived app without touching this file. Pinned to the
  # moving major tag: @v1 follows reviewed compatible releases, @main is
  # forbidden (docs/GITHUB_ACTIONS_ACCESS.md in that repository).
  mobile-quality:
    if: ${{ !github.event.pull_request.draft }}
    # The optional `git-read-token` secret below exists from v1.6.0; the moving
    # @v1 tag carries it since it advanced to v1.7.0. Passing an undeclared
    # secret makes the call fail to start (KI-012), so keep @v1 at or above that.
    uses: FlorianTim/lumbrecode-engineering/.github/workflows/flutter-quality.yml@v1
    # Read access to the private flutter-libraries repository, which
    # `task_interchange` is resolved from (ADR-0017). Read-only Contents, that
    # repository only. docs/operations/local-library-development.md.
    secrets:
      git-read-token: ${{ secrets.FLUTTER_LIBRARIES_TOKEN }}
    with:
      runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
      # Exact on purpose. A floating 3.x cannot be governed: there is no
      # commit to build, so the SDK changes underneath the repository with no
      # pull request and no gate. Flutter 3.47.2 shipped a new analyzer
      # diagnostic as a patch release and turned CI red here on 2026-09-03, a
      # week after 3.47.1 was green. Renovate raises this pin as a normal,
      # reviewable pull request.
      flutter-version: 3.47.1
      java-version: "17"
      bootstrap-command: dart pub global activate melos && melos bs
      codegen-command: melos run codegen
      # melos run ci is format:check + analyze + test, and test covers both
      # the Flutter packages (with coverage) and the pure-Dart ones. The
      # coverage assertion stays here because it is this repository's claim,
      # not a shared one.
      quality-command: |
        melos run ci
        test -f apps/mobile_app/coverage/lcov.info
